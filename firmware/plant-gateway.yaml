# Plant gateway: M5Stack Atom Lite listens passively for Flower Care (HHCCJCY01) and
# Govee H5075 advertisements and posts the collected values to Supabase `ingest`.
# Sensors are discovered automatically; no MACs need to be configured here.

substitutions:
  name: plant-gateway
  send_interval: 10min

esphome:
  name: ${name}
  friendly_name: Plant Gateway
  includes:
    - plant_ble.h

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  # Current and upcoming Wi-Fi, so the router name/password can change without losing the gateway:
  # put the new values in wifi_ssid_next / wifi_password_next, flash via OTA, then change the router.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_next
      password: !secret wifi_password_next
  # If the Wi-Fi is unreachable, the gateway opens this access point for reconfiguration.
  ap:
    ssid: Plant-Gateway-Setup
    password: !secret fallback_ap_password

captive_portal:

# Over-the-air updates from the laptop, so the Atom Lite never needs to come off the wall.
ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  timeout: 10s
  verify_ssl: true

esp32_ble_tracker:
  scan_parameters:
    # Passive: listen to advertisements only, no scan requests. Saves the sensors' batteries.
    active: false
  on_ble_advertise:
    - then:
        - lambda: plant_ble::store().on_advertise(x);

interval:
  - interval: ${send_interval}
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: return plant_ble::store().fresh_count() > 0;
          then:
            - script.execute:
                id: upload
                feedback: false
  - interval: 30s
    then:
      - if:
          condition:
            not:
              script.is_running: led_show
          then:
            - script.execute: led_idle

globals:
  # result of the latest upload, for the button feedback
  - id: upload_failed
    type: bool
    initial_value: "false"
  # millis() of the last successful upload (0 = since boot)
  - id: last_ok_ms
    type: uint32_t
    initial_value: "0"

# The LED stays dark in normal operation (it sits in a living room). Dim red = nothing reached
# Supabase for 25 minutes (no Wi-Fi, uploads failing, or no sensor in range); a single failed
# upload doesn't count. The button shows short colour feedback, see below.
light:
  - platform: esp32_rmt_led_strip
    id: led
    pin: GPIO27
    chipset: SK6812
    rgb_order: GRB
    num_leds: 1
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# Button: short press = send now (handy right after watering, the app shows it immediately);
# hold 5 s = restart.
#   blue   sending          green  sent
#   yellow no sensor heard since the last upload
#   red    no Wi-Fi or upload failed
binary_sensor:
  - platform: gpio
    id: button
    pin:
      number: GPIO39
      inverted: true
    filters:
      - delayed_on: 10ms
    on_click:
      - min_length: 50ms
        max_length: 2s
        then:
          - if:
              condition:
                not:
                  wifi.connected:
              then:
                - script.execute: { id: led_show, r: 1.0, g: 0.0, b: 0.0 }
              else:
                - if:
                    condition:
                      lambda: return plant_ble::store().fresh_count() == 0;
                    then:
                      - script.execute: { id: led_show, r: 1.0, g: 0.6, b: 0.0 }
                    else:
                      - light.turn_on: { id: led, brightness: 100%, red: 0.0, green: 0.3, blue: 1.0 }
                      # the upload blocks the main loop, so let the LED update first
                      - delay: 100ms
                      - script.execute:
                          id: upload
                          feedback: true
      - min_length: 5s
        max_length: 60s
        then:
          - light.turn_on: { id: led, brightness: 100%, red: 0.6, green: 0.0, blue: 1.0 }
          - delay: 300ms
          - lambda: App.safe_reboot();

script:
  - id: upload
    mode: single
    parameters:
      feedback: bool
    then:
      - http_request.post:
          url: !secret ingest_url
          request_headers:
            Content-Type: application/json
            x-device-secret: !secret ingest_secret
          body: !lambda return plant_ble::store().take_json();
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  id(upload_failed) = response->status_code != 200;
                  if (!id(upload_failed)) id(last_ok_ms) = millis();
              - logger.log:
                  level: INFO
                  format: "ingest: HTTP %d %s"
                  args: [response->status_code, body.c_str()]
          on_error:
            then:
              - lambda: id(upload_failed) = true;
              - logger.log:
                  level: WARN
                  format: "ingest: request failed"
      - if:
          condition:
            lambda: return feedback;
          then:
            - script.execute:
                id: led_show
                r: !lambda "return id(upload_failed) ? 1.0f : 0.0f;"
                g: !lambda "return id(upload_failed) ? 0.0f : 0.8f;"
                b: 0.0
          else:
            - script.execute: led_idle

  # A colour for 2 seconds, then back to the resting state.
  - id: led_show
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: led
          brightness: 100%
          red: !lambda return r;
          green: !lambda return g;
          blue: !lambda return b;
      - delay: 2s
      - script.execute: led_idle

  - id: led_idle
    then:
      - if:
          condition:
            lambda: return millis() - id(last_ok_ms) > 25 * 60 * 1000;
          then:
            - light.turn_on: { id: led, brightness: 50%, red: 1.0, green: 0.0, blue: 0.0 }
          else:
            - light.turn_off: led
